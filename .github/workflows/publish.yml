name: Publish Novus pack

# Builds the distributable pack from master and deploys it to GitHub Pages.
# This runs entirely on GitHub's servers — no local machine required. Push a
# change to master (or run manually) and friends' launchers get it on next launch.

on:
  push:
    branches: [ master ]
  workflow_dispatch:        # lets you trigger a build by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write          # allow pruning a stale github-pages artifact left by a re-run

# Only one publish at a time; a newer push supersedes an in-flight one.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Go (to build packwiz)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false          # no go.sum in the repo; skip the module cache (silences its warning)

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Build distributable pack
        run: |
          chmod +x build.sh
          PACKWIZ="$(go env GOPATH)/bin/packwiz" ./build.sh

      # Ship the self-updating Prism instance alongside the pack tree, so it lives
      # at a stable URL (https://b1ll3b0b.github.io/novus/novus.zip) instead of
      # being re-attached to every GitHub Release. It's static across releases.
      - name: Add self-updating instance (novus.zip) to the Pages tree
        run: |
          chmod +x make-prism-instance.sh
          ./make-prism-instance.sh dist/pack

      # Re-running a workflow run keeps the previous attempt's "github-pages"
      # artifact, so deploy-pages then finds two and fails ("Multiple artifacts
      # named github-pages ... count is 2"). Prune any pre-existing one first, so
      # exactly one artifact exists no matter how the run was triggered.
      - name: Prune stale github-pages artifact (guards re-runs)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
          | while read -r id; do
              echo "Deleting stale github-pages artifact $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pack

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
